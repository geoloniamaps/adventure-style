id: place-country
type: symbol
source: geolonia
source-layer: place
filter:
  - all
  - - ==
    - class
    - country
layout:
  text-font:
    - Noto Sans Universal Bold
  text-size:
    stops:
      - - 1
        - 12
      - - 5
        - 20
  text-field: '{name}'
  text-max-width: 6
  text-padding: 20
  text-letter-spacing: 0.15
  # 日本を最優先で配置し、隣国（大韓民国など）とのラベル衝突で日本が消えるのを防ぐ
  symbol-sort-key:
    - case
    - - in
      - - get
        - name
      - - literal
        - ['日本', 'Japan']
    - 0
    - - coalesce
      - - get
        - rank
      - 100
paint:
  text-color: '#f8f0d0'
  text-halo-width: 3
  text-halo-color: '#2a1a08'
